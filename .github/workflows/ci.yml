name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: assessment_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check Backend Types/Syntax
      run: node -c backend/server.js

    - name: Run Backend Tests
      run: npm test --workspace=backend
      env:
        DB_HOST: localhost
        DB_USER: postgres
        DB_PASSWORD: postgrespassword
        DB_NAME: assessment_engine
        REDIS_HOST: localhost

    - name: Run Frontend Tests
      run: npm test --workspace=frontend || echo "No frontend tests configured yet"
