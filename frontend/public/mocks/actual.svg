<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.05" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc" />
  
  <!-- Editor container -->
  <rect x="200" y="50" width="400" height="300" rx="16" fill="#ffffff" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Card Content -->
  <text x="240" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Pro Plan</text>
  <text x="240" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#059669">$29<tspan font-size="16" font-weight="500" fill="#64748b">/mo</tspan></text>
  
  <!-- Actual: Broken lack of flexbox, elements block stacking -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#475569">
    <text x="240" y="200">✓ Unlimited Projects</text>
    <text x="240" y="225">✓ 24/7 Support</text>
  </g>
  
  <!-- ActualButton: Offset due to stacked feature list, and wrong shade of purple -->
  <rect x="240" y="265" width="320" height="48" rx="8" fill="#312e81" />
  <text x="400" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Subscribe Now</text>
</svg>

